name: Bug Report
description: Report a bug or unexpected behaviour in the MyBackend executor plugin
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: A minimal code snippet that reproduces the issue.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: Include the full traceback if applicable.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Python version (`python --version`), qc-executor version, qc-executor-mybackend version, OS"
      placeholder: |
        - Python: 3.11.x
        - qc-executor: 0.1.0
        - qc-executor-mybackend: 0.0.1
        - OS: Ubuntu 22.04
    validations:
      required: true
