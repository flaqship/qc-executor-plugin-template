[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "executor-mybackend"
description = "Executor plugin template — replace this description with your backend's purpose."
readme = "README.md"
authors = [
    {name = "Your Name", email = "you@example.com"},
]
maintainers = [
    {name = "Your Name", email = "you@example.com"},
]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["quantum", "circuit", "executor", "plugin", "backend"]
dependencies = [
    # Pinned to the `develop` branch until the plugin architecture lands on `main`
    # and Executor publishes to PyPI under its real distribution name. See README.
    "executor @ git+https://github.com/flaqship/Executor.git@develop",
    "numpy>=1.20",
]
requires-python = ">=3.10"
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/your-org/executor-mybackend"
Issues = "https://github.com/your-org/executor-mybackend/issues"

[project.entry-points."executor.backends"]
mybackend = "executor_mybackend:MyBackendExecutor"

[dependency-groups]
dev = [
    "black[jupyter]",
    "pylint",
    "pytest",
    "nbmake",
]

[tool.uv]
managed = true

[tool.hatch.version]
path = "src/executor_mybackend/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/executor_mybackend"]

# Required while the `executor` dependency is pinned via a direct git URL.
# Once Executor is published to PyPI under its real distribution name, you
# can swap the dependency for a version pin and remove this line.
[tool.hatch.metadata]
allow-direct-references = true

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
line_length = 99

[tool.pylint]
max-line-length = 99

[tool.pylint.design]
max-attributes = 10
max-args = 10
max-positional-arguments = 10
max-locals = 20
max-public-methods = 50

[tool.pylint.main]
extension-pkg-allow-list = [
    "numpy",
]

[tool.pylint."messages control"]
# TODO comments in this template are intentional hand-offs to the vendor.
disable = ["fixme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
